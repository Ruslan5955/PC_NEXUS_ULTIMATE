
name: Build PC NEXUS EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pyinstaller

      - name: Find and build EXE
        shell: pwsh
        run: |
          $script = Get-ChildItem -Path . -Filter main.py -Recurse -File | Select-Object -First 1

          if (-not $script) {
            Write-Error "main.py not found in repository"
            exit 1
          }

          Write-Host "Building from: $($script.FullName)"
          pyinstaller --noconfirm --onefile --windowed --name PC_NEXUS "$($script.FullName)"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PC-NEXUS-Windows
          path: dist/PC_NEXUS.exe
