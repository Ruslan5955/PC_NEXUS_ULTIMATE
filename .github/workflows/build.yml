
name: Build PC NEXUS EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PC_NEXUS pc_nexus/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PC-NEXUS-Windows
          path: dist/PC_NEXUS.exe
