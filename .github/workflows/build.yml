
      - name: Find and build EXE
        shell: pwsh
        run: |
          $script = Get-ChildItem -Path . -Filter main.py -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\\.git\\|\\build\\' } |
            Select-Object -First 1

          if (-not $script) {
            Write-Error "main.py not found in repository"
            exit 1
          }

          Write-Host "Building from: $($script.FullName)"
          pyinstaller --noconfirm --onefile --windowed --name PC_NEXUS $script.FullName
